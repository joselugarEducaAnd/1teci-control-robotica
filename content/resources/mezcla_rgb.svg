<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Tres círculos de luz roja, verde y azul que se solapan sobre fondo negro: donde se juntan rojo y verde sale amarillo, verde y azul dan cian, rojo y azul dan magenta, y los tres juntos dan blanco.</title><rect width="860" height="440" fill="white"/><text x="30" y="30" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Mezcla de luz: rojo, verde y azul</text><g style="mix-blend-mode:normal"><rect x="30" y="62" width="400" height="365" rx="14" fill="#111"/><g style="isolation:isolate"><circle cx="230" cy="185" r="95" fill="#ff0000" style="mix-blend-mode:screen"/><circle cx="168" cy="290" r="95" fill="#00ff00" style="mix-blend-mode:screen"/><circle cx="292" cy="290" r="95" fill="#0000ff" style="mix-blend-mode:screen"/></g></g><text x="230" y="120" font-size="15" fill="white" text-anchor="middle" font-weight="bold">rojo</text><text x="105" y="345" font-size="15" fill="white" text-anchor="middle" font-weight="bold">verde</text><text x="355" y="345" font-size="15" fill="white" text-anchor="middle" font-weight="bold">azul</text><rect x="470" y="108" width="34" height="34" rx="6" fill="#ffff00" stroke="#263c4a" stroke-width="1.5"/><text x="520" y="130" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">rojo + verde</text><text x="520" y="152" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">= amarillo</text><rect x="470" y="170" width="34" height="34" rx="6" fill="#00ffff" stroke="#263c4a" stroke-width="1.5"/><text x="520" y="192" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">verde + azul</text><text x="520" y="214" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">= cian</text><rect x="470" y="232" width="34" height="34" rx="6" fill="#ff00ff" stroke="#263c4a" stroke-width="1.5"/><text x="520" y="254" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">rojo + azul</text><text x="520" y="276" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">= magenta</text><rect x="470" y="294" width="34" height="34" rx="6" fill="#ffffff" stroke="#263c4a" stroke-width="1.5"/><text x="520" y="316" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">los tres</text><text x="520" y="338" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">= blanco</text><text x="470" y="400" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Con analogWrite das a cada color un valor de 0 a 255:</text><text x="470" y="422" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">256 × 256 × 256 = 16 777 216 combinaciones.</text></svg>
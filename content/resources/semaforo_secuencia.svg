<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Línea de tiempo del semáforo de la tarea SD2: 4 segundos en verde, 2 segundos de ámbar parpadeando cinco veces con un pitido en cada parpadeo y 1 segundo en rojo; después se repite.</title><rect width="860" height="290" fill="white"/><text x="30" y="30" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Tarea SD2: la secuencia del semáforo en el tiempo</text><rect x="40" y="70" width="440" height="50" fill="#2e9d4f" stroke="white" stroke-width="2"/><text x="260.0" y="101" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Verde</text><text x="260.0" y="144" font-size="13" fill="#263c4a" text-anchor="middle" font-weight="normal">LED RGB en verde</text><rect x="480" y="70" width="220" height="50" fill="#e0a000" stroke="white" stroke-width="2"/><text x="590.0" y="101" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Ámbar</text><text x="590.0" y="144" font-size="13" fill="#263c4a" text-anchor="middle" font-weight="normal">5 parpadeos con pitido</text><rect x="700" y="70" width="110" height="50" fill="#c43232" stroke="white" stroke-width="2"/><text x="755.0" y="101" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Rojo</text><text x="755.0" y="144" font-size="13" fill="#263c4a" text-anchor="middle" font-weight="normal">rojo</text><polyline points="40,160 40,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="40" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">0 s</text><polyline points="150,160 150,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="150" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">1 s</text><polyline points="260,160 260,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="260" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">2 s</text><polyline points="370,160 370,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="370" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">3 s</text><polyline points="480,160 480,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="480" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">4 s</text><polyline points="590,160 590,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="590" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">5 s</text><polyline points="700,160 700,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="700" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">6 s</text><polyline points="810,160 810,168" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="810" y="186" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">7 s</text><text x="420" y="212" font-size="14" fill="#263c4a" text-anchor="start" font-weight="bold">Detalle del ámbar: 2 s para 5 parpadeos</text><rect x="480" y="220" width="14" height="26" fill="#e0a000"/><rect x="508" y="220" width="14" height="26" fill="#e0a000"/><rect x="536" y="220" width="14" height="26" fill="#e0a000"/><rect x="564" y="220" width="14" height="26" fill="#e0a000"/><rect x="592" y="220" width="14" height="26" fill="#e0a000"/><text x="40" y="270" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Cada parpadeo dura 2000 / 5 = 400 ms: 200 ms encendido y 200 ms apagado. Después, vuelta a empezar.</text></svg>
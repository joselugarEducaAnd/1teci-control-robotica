<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 385" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Circuito de un LED en una salida de Arduino: el pin da 5 V, el LED se queda con unos 2 V y la resistencia en serie con los 3 V restantes, lo que fija la corriente.</title><rect width="720" height="385" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Por qué el LED lleva una resistencia en serie</text><rect x="40" y="70" width="150" height="200" rx="14" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="115" y="165" font-size="18" fill="#943d92" text-anchor="middle" font-weight="bold">Arduino</text><rect x="183" y="103" width="14" height="14" fill="#943d92"/><text x="176" y="116" font-size="15" fill="#943d92" text-anchor="end" font-weight="bold">D12</text><polyline points="197,110 330,110" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="330,110 350,110" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="350" y="101" width="50" height="18" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="400,110 420,110" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="375" y="85" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">R</text><text x="375" y="150" font-size="14" fill="#d9822b" text-anchor="middle" font-weight="bold">cae V_R = 5 − 2 = 3 V</text><polyline points="420,110 520,110 520,150" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="520,150 520,176" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polygon points="506,176 534,176 520,200" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="506,200 534,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="520,200 520,230" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><line x1="538" y1="178" x2="560" y2="164" stroke="#b93649" stroke-width="2"/><polygon points="560,164 553.2,173.9 548.2,166.0" fill="#b93649"/><line x1="538" y1="192" x2="560" y2="178" stroke="#b93649" stroke-width="2"/><polygon points="560,178 553.2,187.9 548.2,180.0" fill="#b93649"/><text x="566" y="198" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED rojo</text><text x="560" y="230" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">cae unos 2 V</text><polyline points="520,230 520,260" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="520,260 520,270" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="504,270 536,270" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="510,276 530,276" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="516,282 524,282" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><rect x="183" y="233" width="14" height="14" fill="#943d92"/><text x="176" y="246" font-size="15" fill="#943d92" text-anchor="end" font-weight="bold">GND</text><polyline points="197,240 260,240 260,300 520,300 520,282" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><text x="30" y="340" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">La resistencia se queda con la tensión que sobra y limita la corriente:</text><text x="30" y="366" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">R = (5 V − 2 V) / I.   Con I = 15 mA sale R = 3 / 0,015 = 200 Ω.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Línea de tiempo de 0 a 3000 milisegundos: el LED rojo cambia de estado cada 300 ms y el azul cada 1000 ms, los dos a la vez, gracias a millis().</title><rect width="900" height="335" fill="white"/><text x="30" y="30" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Dos ritmos a la vez con millis()</text><text x="214" y="90" font-size="15" fill="#c43232" text-anchor="end" font-weight="bold">LED rojo (300 ms)</text><polyline points="230,104 293.0,104 293.0,66 293.0,66 356.0,66 356.0,104 356.0,104 419.0,104 419.0,66 419.0,66 482.0,66 482.0,104 482.0,104 545.0,104 545.0,66 545.0,66 608.0,66 608.0,104 608.0,104 671.0,104 671.0,66 671.0,66 734.0,66 734.0,104 734.0,104 797.0,104 797.0,66 797.0,66 860.0,66 860.0,104" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="214" y="180" font-size="15" fill="#2f5fa8" text-anchor="end" font-weight="bold">LED azul (1000 ms)</text><polyline points="230,194 440.0,194 440.0,156 440.0,156 650.0,156 650.0,194 650.0,194 860.0,194 860.0,156" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="230.0,230 230.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="230.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">0</text><polyline points="335.0,230 335.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="335.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">500</text><polyline points="440.0,230 440.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="440.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">1000</text><polyline points="545.0,230 545.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="545.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">1500</text><polyline points="650.0,230 650.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="650.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">2000</text><polyline points="755.0,230 755.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="755.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">2500</text><polyline points="860.0,230 860.0,238" fill="none" stroke="#6b7785" stroke-width="1.5" stroke-linejoin="round"/><text x="860.0" y="256" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">3000</text><text x="882.0" y="256" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">ms</text><text x="30" y="292" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">loop() se repite miles de veces por segundo; en cada vuelta, cada LED mira si ya le toca cambiar.</text><text x="30" y="316" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Con delay() el programa se quedaría parado esperando a uno de los dos y el otro no podría cambiar a tiempo.</text></svg>
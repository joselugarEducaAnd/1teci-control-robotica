<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 586" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Cinco señales PWM: al 0 % la salida está siempre a 0 V; al 25, 50 y 75 % está a 5 V esa fracción de cada periodo, y al 100 % está siempre a 5 V. Junto a cada una, el valor de analogWrite (0, 64, 128, 191 y 255) y la tensión media (0; 1,25; 2,5; 3,75 y 5 V).</title><rect width="980" height="586" fill="white"/><text x="30" y="30" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">PWM: la salida se enciende y se apaga muy deprisa</text><text x="96" y="75" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">5 V</text><text x="96" y="119" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">0 V</text><polyline points="110,114 590,114" fill="none" stroke="#c9d2da" stroke-width="1" stroke-linejoin="round"/><polyline points="110,114 206,114 206,114 302,114 302,114 398,114 398,114 494,114 494,114 590,114" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="110,114.0 590,114.0" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="614" y="82" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0 %  →  analogWrite(pin, 0)</text><text x="614" y="106" font-size="14" fill="#c43232" text-anchor="start" font-weight="normal">tensión media: 0,00 V</text><text x="96" y="167" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">5 V</text><text x="96" y="211" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">0 V</text><polyline points="110,206 590,206" fill="none" stroke="#c9d2da" stroke-width="1" stroke-linejoin="round"/><polyline points="110,206 110,162 134.0,162 134.0,206 206,206 206,206 206,162 230.0,162 230.0,206 302,206 302,206 302,162 326.0,162 326.0,206 398,206 398,206 398,162 422.0,162 422.0,206 494,206 494,206 494,162 518.0,162 518.0,206 590,206" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="110,195.0 590,195.0" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="614" y="174" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">25 %  →  analogWrite(pin, 64)</text><text x="614" y="198" font-size="14" fill="#c43232" text-anchor="start" font-weight="normal">tensión media: 1,25 V</text><text x="96" y="259" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">5 V</text><text x="96" y="303" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">0 V</text><polyline points="110,298 590,298" fill="none" stroke="#c9d2da" stroke-width="1" stroke-linejoin="round"/><polyline points="110,298 110,254 158.0,254 158.0,298 206,298 206,298 206,254 254.0,254 254.0,298 302,298 302,298 302,254 350.0,254 350.0,298 398,298 398,298 398,254 446.0,254 446.0,298 494,298 494,298 494,254 542.0,254 542.0,298 590,298" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="110,276.0 590,276.0" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="614" y="266" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">50 %  →  analogWrite(pin, 128)</text><text x="614" y="290" font-size="14" fill="#c43232" text-anchor="start" font-weight="normal">tensión media: 2,50 V</text><text x="96" y="351" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">5 V</text><text x="96" y="395" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">0 V</text><polyline points="110,390 590,390" fill="none" stroke="#c9d2da" stroke-width="1" stroke-linejoin="round"/><polyline points="110,390 110,346 182.0,346 182.0,390 206,390 206,390 206,346 278.0,346 278.0,390 302,390 302,390 302,346 374.0,346 374.0,390 398,390 398,390 398,346 470.0,346 470.0,390 494,390 494,390 494,346 566.0,346 566.0,390 590,390" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="110,357.0 590,357.0" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="614" y="358" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">75 %  →  analogWrite(pin, 191)</text><text x="614" y="382" font-size="14" fill="#c43232" text-anchor="start" font-weight="normal">tensión media: 3,75 V</text><text x="96" y="443" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">5 V</text><text x="96" y="487" font-size="12" fill="#6b7785" text-anchor="end" font-weight="normal">0 V</text><polyline points="110,482 590,482" fill="none" stroke="#c9d2da" stroke-width="1" stroke-linejoin="round"/><polyline points="110,438 206,438 206,438 302,438 302,438 398,438 398,438 494,438 494,438 590,438" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="110,438.0 590,438.0" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="614" y="450" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">100 %  →  analogWrite(pin, 255)</text><text x="614" y="474" font-size="14" fill="#c43232" text-anchor="start" font-weight="normal">tensión media: 5,00 V</text><polyline points="110,536 150,536" fill="none" stroke="#c43232" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="160" y="541" font-size="13" fill="#c43232" text-anchor="start" font-weight="normal">tensión media (lo que «nota» el LED)</text><text x="110" y="566" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">En los pines 9, 10 y 11, cada periodo dura unos 2 ms (unas 490 veces por segundo): el ojo no ve el parpadeo.</text></svg>
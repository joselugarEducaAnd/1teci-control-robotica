<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Dos esquemas de la LDR del shield en serie con una resistencia de 10 kilohmios entre 5 voltios y GND, con el pin A1 en el punto medio: a oscuras la LDR vale unos 50 kilohmios, A1 recibe 0,8 voltios y se lee unos 170; con mucha luz vale unos 2 kilohmios, A1 recibe 4,2 voltios y se lee unos 850.</title><rect width="900" height="430" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">La LDR y una resistencia fija forman un divisor de tensión</text><rect x="40" y="50" width="400" height="340" rx="12" fill="white" stroke="#e4c8e3" stroke-width="2"/><text x="60" y="80" font-size="18" fill="#943d92" text-anchor="start" font-weight="bold">A oscuras</text><polyline points="134,110 166,110" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="150" y="102" font-size="15" fill="#c43232" text-anchor="middle" font-weight="bold">5 V</text><polyline points="150,115 150,135" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="141" y="135" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="150,185 150,205" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="150" cy="160" r="30" fill="none" stroke="#263c4a" stroke-width="2"/><line x1="88" y1="128" x2="120" y2="146" stroke="#16725e" stroke-width="2"/><polygon points="120,146 108.1,144.7 112.7,136.5" fill="#16725e"/><line x1="88" y1="144" x2="120" y2="162" stroke="#16725e" stroke-width="2"/><polygon points="120,162 108.1,160.7 112.7,152.5" fill="#16725e"/><text x="188" y="165" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LDR ≈ 50 kΩ</text><polyline points="150,205 150,245" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="150" cy="225" r="5" fill="#263c4a"/><polyline points="150,225 300,225" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="300" y="218" width="14" height="14" fill="#943d92"/><text x="321" y="231" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold">A1</text><polyline points="150,245 150,265" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="141" y="265" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="150,315 150,335" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="166" y="295" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">10 kΩ</text><polyline points="150,335 150,345" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="134,345 166,345" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="140,351 160,351" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="146,357 154,357" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><rect x="275" y="250" width="130" height="62" rx="8" fill="white" stroke="#6b7785" stroke-width="2.5"/><text x="340" y="275" font-size="17" fill="#263c4a" text-anchor="middle" font-weight="bold">0,8 V</text><text x="340" y="300" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">≈ 170</text><rect x="470" y="50" width="400" height="340" rx="12" fill="#f8eff8" stroke="#e4c8e3" stroke-width="2"/><text x="490" y="80" font-size="18" fill="#943d92" text-anchor="start" font-weight="bold">Con mucha luz</text><polyline points="564,110 596,110" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="580" y="102" font-size="15" fill="#c43232" text-anchor="middle" font-weight="bold">5 V</text><polyline points="580,115 580,135" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="571" y="135" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="580,185 580,205" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="580" cy="160" r="30" fill="none" stroke="#263c4a" stroke-width="2"/><line x1="518" y1="128" x2="550" y2="146" stroke="#16725e" stroke-width="2"/><polygon points="550,146 538.1,144.7 542.7,136.5" fill="#16725e"/><line x1="518" y1="144" x2="550" y2="162" stroke="#16725e" stroke-width="2"/><polygon points="550,162 538.1,160.7 542.7,152.5" fill="#16725e"/><text x="618" y="165" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LDR ≈ 2 kΩ</text><polyline points="580,205 580,245" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="580" cy="225" r="5" fill="#263c4a"/><polyline points="580,225 730,225" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="730" y="218" width="14" height="14" fill="#943d92"/><text x="751" y="231" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold">A1</text><polyline points="580,245 580,265" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="571" y="265" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="580,315 580,335" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="596" y="295" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">10 kΩ</text><polyline points="580,335 580,345" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="564,345 596,345" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="570,351 590,351" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="576,357 584,357" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><rect x="705" y="250" width="130" height="62" rx="8" fill="white" stroke="#16725e" stroke-width="2.5"/><text x="770" y="275" font-size="17" fill="#263c4a" text-anchor="middle" font-weight="bold">4,2 V</text><text x="770" y="300" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">≈ 850</text><text x="30" y="415" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Tensión en A1: V = 5 V · 10 kΩ / (10 kΩ + R LDR). Cuanta más luz, menor es la LDR y mayor la lectura.</text></svg>
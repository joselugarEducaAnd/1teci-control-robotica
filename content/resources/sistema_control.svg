<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Diagrama de bloques de un sistema en lazo cerrado: la consigna entra al comparador, el error va al controlador, este manda al actuador, que modifica el proceso; una perturbación afecta al proceso y el sensor mide la salida y la devuelve al comparador con signo menos.</title><rect width="920" height="365" fill="white"/><text x="30" y="36" font-size="20" fill="#943d92" text-anchor="start" font-weight="bold">Los elementos de un sistema de control en lazo cerrado</text><rect x="20" y="95" width="130" height="66" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="85.0" y="124.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Consigna</text><text x="85.0" y="142.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">lo que quieres</text><circle cx="215" cy="128" r="26" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="215" y="88" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="normal">Comparador</text><line x1="150" y1="128" x2="189" y2="128" stroke="#263c4a" stroke-width="2.5"/><polygon points="189,128 177.9,132.7 177.9,123.3" fill="#263c4a"/><text x="178" y="118" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">+</text><rect x="290" y="95" width="150" height="66" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="365.0" y="124.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Controlador</text><text x="365.0" y="142.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">decide</text><line x1="241" y1="128" x2="290" y2="128" stroke="#263c4a" stroke-width="2.5"/><polygon points="290,128 278.9,132.7 278.9,123.3" fill="#263c4a"/><text x="265.5" y="118.0" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">error</text><rect x="500" y="95" width="140" height="66" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="570.0" y="124.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Actuador</text><text x="570.0" y="142.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">actúa</text><line x1="440" y1="128" x2="500" y2="128" stroke="#263c4a" stroke-width="2.5"/><polygon points="500,128 488.9,132.7 488.9,123.3" fill="#263c4a"/><rect x="700" y="95" width="150" height="66" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="775.0" y="124.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Proceso</text><text x="775.0" y="142.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">lo que se controla</text><line x1="640" y1="128" x2="700" y2="128" stroke="#263c4a" stroke-width="2.5"/><polygon points="700,128 688.9,132.7 688.9,123.3" fill="#263c4a"/><line x1="850" y1="128" x2="905" y2="128" stroke="#263c4a" stroke-width="2.5"/><polygon points="905,128 893.9,132.7 893.9,123.3" fill="#263c4a"/><text x="905" y="158" font-size="15" fill="#263c4a" text-anchor="end" font-weight="bold">salida</text><line x1="775" y1="50" x2="775" y2="95" stroke="#c43232" stroke-width="2.5"/><polygon points="775,95 770.3,83.9 779.7,83.9" fill="#c43232"/><text x="785" y="56" font-size="14" fill="#c43232" text-anchor="start" font-weight="bold">Perturbación</text><rect x="500" y="225" width="140" height="60" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="570.0" y="251.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor</text><text x="570.0" y="269.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">mide la salida</text><polyline points="880,128 880,255 640,255" fill="none" stroke="#d9822b" stroke-width="3" stroke-linejoin="round"/><polyline points="500,255 215,255" fill="none" stroke="#d9822b" stroke-width="3" stroke-linejoin="round"/><line x1="215" y1="255" x2="215" y2="154" stroke="#d9822b" stroke-width="3"/><polygon points="215,154 219.7,165.1 210.3,165.1" fill="#d9822b"/><text x="207" y="182" font-size="22" fill="#d9822b" text-anchor="end" font-weight="bold">−</text><text x="450" y="320" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="bold">Realimentación: el sensor devuelve al comparador una medida de la salida.</text><text x="450" y="345" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">Error = consigna − medida. El controlador actúa para que el error se haga lo más pequeño posible.</text></svg>
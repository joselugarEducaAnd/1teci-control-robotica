<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Estructura de un programa de Arduino: arriba las variables y constantes globales; después setup, que se ejecuta una sola vez; y por último loop, que se repite sin parar.</title><rect width="680" height="390" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Las tres partes de un programa de Arduino</text><rect x="150" y="55" width="380" height="66" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="340.0" y="84.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Variables y constantes globales</text><text x="340.0" y="102.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">arriba del todo, fuera de las funciones</text><line x1="340" y1="121" x2="340" y2="156" stroke="#263c4a" stroke-width="2.5"/><polygon points="340,156 335.3,144.9 344.7,144.9" fill="#263c4a"/><rect x="150" y="156" width="380" height="66" rx="10" fill="#f8eff8" stroke="#263c4a" stroke-width="2.5"/><text x="340.0" y="185.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">setup()</text><text x="340.0" y="203.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">se ejecuta una sola vez, al encender o reiniciar</text><line x1="340" y1="222" x2="340" y2="257" stroke="#263c4a" stroke-width="2.5"/><polygon points="340,257 335.3,245.9 344.7,245.9" fill="#263c4a"/><rect x="150" y="257" width="380" height="66" rx="10" fill="#f8eff8" stroke="#263c4a" stroke-width="2.5"/><text x="340.0" y="286.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">loop()</text><text x="340.0" y="304.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">se repite sin parar mientras haya corriente</text><polyline points="530,290 580,290 580,345 100,345 100,290" fill="none" stroke="#943d92" stroke-width="2.5" stroke-linejoin="round"/><line x1="100" y1="290" x2="150" y2="290" stroke="#943d92" stroke-width="2.5"/><polygon points="150,290 138.9,294.7 138.9,285.3" fill="#943d92"/><text x="340" y="372" font-size="14" fill="#943d92" text-anchor="middle" font-weight="normal">al terminar loop(), vuelve a empezar loop()</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Señal de la línea TX al enviar la letra A a 9600 baudios: en reposo está a 5 voltios; el bit de inicio la baja a 0; después van los ocho bits del número 65 empezando por el de menor peso, 1, 0, 0, 0, 0, 0, 1 y 0; el bit de parada la devuelve a 5 voltios. Cada bit dura unos 0,104 milisegundos y el carácter completo unos 1,04 milisegundos.</title><rect width="900" height="375" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Así viaja la letra A por el cable: un bit detrás de otro</text><rect x="50" y="80" width="66" height="140" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="83.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text><text x="83.0" y="242" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="normal">reposo</text><rect x="116" y="80" width="66" height="140" fill="#fdf1e4" stroke="#e4c8e3" stroke-width="1"/><text x="149.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="149.0" y="242" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="normal">inicio</text><rect x="182" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="215.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text><text x="215.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b0</text><rect x="248" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="281.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="281.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b1</text><rect x="314" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="347.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="347.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b2</text><rect x="380" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="413.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="413.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b3</text><rect x="446" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="479.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="479.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b4</text><rect x="512" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="545.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="545.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b5</text><rect x="578" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="611.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text><text x="611.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b6</text><rect x="644" y="80" width="66" height="140" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="677.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><text x="677.0" y="242" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">b7</text><rect x="710" y="80" width="66" height="140" fill="#fdf1e4" stroke="#e4c8e3" stroke-width="1"/><text x="743.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text><text x="743.0" y="242" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="normal">parada</text><rect x="776" y="80" width="66" height="140" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="809.0" y="70" font-size="18" fill="#263c4a" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1</text><text x="809.0" y="242" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="normal">reposo</text><polyline points="50,110 116,110 116,190 182,190 182,110 248,110 248,190 314,190 314,190 380,190 380,190 446,190 446,190 512,190 512,190 578,190 578,110 644,110 644,190 710,190 710,110 776,110 776,110 842,110" fill="none" stroke="#2f5fa8" stroke-width="3.5" stroke-linejoin="round"/><text x="42" y="115" font-size="13" fill="#c43232" text-anchor="end" font-weight="bold">5 V</text><text x="42" y="195" font-size="13" fill="#2f5fa8" text-anchor="end" font-weight="bold">0 V</text><line x1="182" y1="290" x2="710" y2="290" stroke="#943d92" stroke-width="2"/><polygon points="710,290 698.9,294.7 698.9,285.3" fill="#943d92"/><line x1="710" y1="290" x2="182" y2="290" stroke="#943d92" stroke-width="2"/><polygon points="182,290 193.1,285.3 193.1,294.7" fill="#943d92"/><text x="446" y="282" font-size="14" fill="#943d92" text-anchor="middle" font-weight="bold">65 = 01000001 en binario, empezando por el bit de menor peso (b0)</text><text x="30" y="330" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">A 9600 baudios cada bit dura 1/9600 s ≈ 0,104 ms. Con el bit de inicio y el de parada son 10 bits:</text><text x="30" y="354" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">cada carácter tarda unos 1,04 ms y por el cable caben unos 960 caracteres por segundo.</text></svg>
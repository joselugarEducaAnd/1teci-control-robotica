<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Comparación en dos columnas: a la izquierda, un programa con reglas, donde una persona escribe la regla if luz menor que 300 encender, y un dato nuevo da una decisión; a la derecha, el aprendizaje automático, donde unos ejemplos con su respuesta entrenan un modelo, y un dato nuevo pasa por el modelo y da una decisión con su confianza.</title><rect width="900" height="370" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Dos formas de decidir: reglas escritas y reglas aprendidas</text><rect x="20" y="50" width="420" height="300" rx="12" fill="white" stroke="#e4c8e3" stroke-width="2"/><rect x="460" y="50" width="420" height="300" rx="12" fill="#f8eff8" stroke="#e4c8e3" stroke-width="2"/><text x="40" y="80" font-size="17" fill="#263c4a" text-anchor="start" font-weight="bold">Programa con reglas</text><text x="480" y="80" font-size="17" fill="#943d92" text-anchor="start" font-weight="bold">Aprendizaje automático</text><rect x="40" y="100" width="380" height="50" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="230.0" y="121.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Una persona escribe la regla:</text><text x="230.0" y="138.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">if (luz &lt; 300) encender;</text><line x1="230" y1="152" x2="230" y2="178" stroke="#263c4a" stroke-width="2.5"/><polygon points="230,178 225.3,166.9 234.7,166.9" fill="#263c4a"/><rect x="40" y="180" width="170" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="125.0" y="206.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Dato nuevo</text><text x="125.0" y="223.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">luz = 250</text><line x1="212" y1="210" x2="248" y2="210" stroke="#263c4a" stroke-width="2.5"/><polygon points="248,210 236.9,214.7 236.9,205.3" fill="#263c4a"/><rect x="250" y="180" width="170" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="335.0" y="206.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Decisión</text><text x="335.0" y="223.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">encender</text><text x="40" y="280" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Hace siempre lo mismo y se puede comprobar</text><text x="40" y="300" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">línea a línea, pero alguien tiene que saber</text><text x="40" y="320" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">escribir la regla.</text><rect x="480" y="100" width="380" height="50" rx="10" fill="white" stroke="#943d92" stroke-width="2.5"/><text x="670.0" y="121.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Ejemplos con su respuesta</text><text x="670.0" y="138.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">(datos de entrenamiento)</text><line x1="670" y1="152" x2="670" y2="178" stroke="#943d92" stroke-width="2.5"/><polygon points="670,178 665.3,166.9 674.7,166.9" fill="#943d92"/><text x="680" y="170" font-size="12" fill="#943d92" text-anchor="start" font-weight="bold">entrenar</text><rect x="480" y="180" width="120" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="540.0" y="206.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Dato</text><text x="540.0" y="223.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">nuevo</text><line x1="602" y1="210" x2="618" y2="210" stroke="#263c4a" stroke-width="2.5"/><polygon points="618,210 606.9,214.7 606.9,205.3" fill="#263c4a"/><rect x="620" y="180" width="100" height="60" rx="10" fill="white" stroke="#943d92" stroke-width="2.5"/><text x="670.0" y="214.9" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Modelo</text><line x1="722" y1="210" x2="738" y2="210" stroke="#263c4a" stroke-width="2.5"/><polygon points="738,210 726.9,214.7 726.9,205.3" fill="#263c4a"/><rect x="740" y="180" width="120" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="800.0" y="206.75" font-size="13" fill="#263c4a" text-anchor="middle" font-weight="bold">Decisión</text><text x="800.0" y="222.35" font-size="13" fill="#263c4a" text-anchor="middle" font-weight="normal">y confianza</text><text x="480" y="280" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Descubre la regla en los datos, incluso las que</text><text x="480" y="300" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">nadie sabría escribir, pero puede equivocarse</text><text x="480" y="320" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">en casos que no se parecen a sus ejemplos.</text></svg>
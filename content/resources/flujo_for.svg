<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Diagrama de flujo de un bucle for: se inicializa i a 0, se comprueba si i es menor que 5; si lo es, se ejecuta el cuerpo y se suma 1 a i y se vuelve a comprobar; si no, el programa sigue.</title><rect width="900" height="415" fill="white"/><text x="30" y="30" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Cómo se ejecuta un bucle for</text><rect x="120" y="50" width="230" height="50" rx="10" fill="#f8eff8" stroke="#263c4a" stroke-width="2.5"/><text x="235.0" y="80.6" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">int i = 0</text><line x1="235" y1="100" x2="235" y2="130" stroke="#263c4a" stroke-width="2.5"/><polygon points="235,130 230.3,118.9 239.7,118.9" fill="#263c4a"/><polygon points="235,130 335,180 235,230 135,180" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="235" y="186" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">¿i &lt; 5?</text><line x1="235" y1="230" x2="235" y2="265" stroke="#263c4a" stroke-width="2.5"/><polygon points="235,265 230.3,253.9 239.7,253.9" fill="#263c4a"/><text x="248" y="252" font-size="14" fill="#16725e" text-anchor="start" font-weight="bold">sí</text><rect x="120" y="265" width="230" height="54" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="235.0" y="288.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">cuerpo del bucle</text><text x="235.0" y="305.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">(lo que se repite)</text><line x1="235" y1="319" x2="235" y2="350" stroke="#263c4a" stroke-width="2.5"/><polygon points="235,350 230.3,338.9 239.7,338.9" fill="#263c4a"/><rect x="120" y="350" width="230" height="50" rx="10" fill="#f8eff8" stroke="#263c4a" stroke-width="2.5"/><text x="235.0" y="380.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">i++  (i = i + 1)</text><polyline points="120,375 70,375 70,180" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="180" x2="135" y2="180" stroke="#263c4a" stroke-width="2.5"/><polygon points="135,180 123.9,184.7 123.9,175.3" fill="#263c4a"/><line x1="335" y1="180" x2="430" y2="180" stroke="#263c4a" stroke-width="2.5"/><polygon points="430,180 418.9,184.7 418.9,175.3" fill="#263c4a"/><text x="380" y="170" font-size="14" fill="#c43232" text-anchor="middle" font-weight="bold">no</text><rect x="430" y="155" width="240" height="50" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="550.0" y="185.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">sigue el programa</text><text x="450" y="260" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">for (int i = 0; i &lt; 5; i++) { … }</text><text x="450" y="290" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">1.º inicialización: se hace una vez.</text><text x="450" y="314" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">2.º condición: se comprueba antes de cada vuelta.</text><text x="450" y="338" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">3.º incremento: se hace al final de cada vuelta.</text><text x="450" y="370" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Con estos valores, el cuerpo se ejecuta 5 veces:</text><text x="450" y="392" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">i vale 0, 1, 2, 3 y 4.</text></svg>
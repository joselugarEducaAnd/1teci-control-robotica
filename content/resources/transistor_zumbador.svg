<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 385" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Esquema del zumbador del shield: el pin D5 ataca, a través de una resistencia de 1 kΩ, la base de un transistor NPN 8050, que conecta el altavoz entre 5 V y GND.</title><rect width="820" height="385" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Una salida que gobierna algo que consume más: el zumbador del shield</text><rect x="30" y="80" width="140" height="160" rx="14" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="100" y="165" font-size="18" fill="#943d92" text-anchor="middle" font-weight="bold">Arduino</text><rect x="163" y="193" width="14" height="14" fill="#943d92"/><text x="156" y="206" font-size="15" fill="#943d92" text-anchor="end" font-weight="bold">D5</text><polyline points="177,200 250,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="250,200 270,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="270" y="191" width="50" height="18" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="320,200 340,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="295" y="178" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">1 kΩ</text><polyline points="340,200 420,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="450" cy="200" r="36" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="420,200 438,200" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="438,178 438,222" fill="none" stroke="#263c4a" stroke-width="3" stroke-linejoin="round"/><polyline points="438,190 468,168 468,120" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="438,210 468,232 468,280" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><line x1="450" y1="220" x2="466" y2="231" stroke="#263c4a" stroke-width="2.5"/><polygon points="466,231 454.2,228.6 459.5,220.9" fill="#263c4a"/><text x="500" y="205" font-size="14" fill="#263c4a" text-anchor="start" font-weight="bold">transistor 8050</text><polyline points="468,280 468,290" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="452,290 484,290" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="458,296 478,296" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="464,302 472,302" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><rect x="440" y="80" width="56" height="40" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="468" y="105" font-size="20" fill="#263c4a" text-anchor="middle" font-weight="normal">♪</text><text x="510" y="100" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">altavoz (zumbador)</text><polyline points="468,80 468,60" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="452,60 484,60" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="468" y="52" font-size="15" fill="#c43232" text-anchor="middle" font-weight="bold">5 V</text><text x="30" y="340" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">El pin D5 solo da una corriente muy pequeña a la base del transistor; el transistor deja pasar,</text><text x="30" y="364" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">desde los 5 V, la corriente mayor que necesita el altavoz. Es un interruptor gobernado por el pin.</text></svg>
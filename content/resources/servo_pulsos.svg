<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Tres señales de servo con un pulso cada 20 milisegundos: un pulso de 0,5 milisegundos lleva el brazo a 0 grados, uno de 1,5 milisegundos a 90 grados y uno de 2,4 milisegundos a 180 grados.</title><rect width="900" height="470" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">La señal del servo: un pulso cada 20 ms; su duración fija el ángulo</text><text x="30" y="98" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">write(0)</text><polyline points="130,110 150,110 150,70 165.232,70 165.232,110 710,110 710,70 725.232,70 725.232,110 800,110" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><text x="171.232" y="74" font-size="13" fill="#2f5fa8" text-anchor="start" font-weight="bold">0,5 ms</text><circle cx="856" cy="90" r="34" fill="#f8eff8" stroke="#e4c8e3" stroke-width="2"/><polyline points="856,90 826.0,90.0" fill="none" stroke="#263c4a" stroke-width="6" stroke-linejoin="round"/><circle cx="856" cy="90" r="6" fill="#263c4a"/><text x="856" y="142" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">0°</text><text x="30" y="218" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">write(90)</text><polyline points="130,230 150,230 150,190 191.16,190 191.16,230 710,230 710,190 751.16,190 751.16,230 800,230" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><text x="197.16" y="194" font-size="13" fill="#2f5fa8" text-anchor="start" font-weight="bold">1,5 ms</text><circle cx="856" cy="210" r="34" fill="#f8eff8" stroke="#e4c8e3" stroke-width="2"/><polyline points="856,210 856.0,180.0" fill="none" stroke="#263c4a" stroke-width="6" stroke-linejoin="round"/><circle cx="856" cy="210" r="6" fill="#263c4a"/><text x="856" y="262" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">90°</text><text x="30" y="338" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">write(180)</text><polyline points="130,350 150,350 150,310 217.2,310 217.2,350 710,350 710,310 777.2,310 777.2,350 800,350" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><text x="223.2" y="314" font-size="13" fill="#2f5fa8" text-anchor="start" font-weight="bold">2,4 ms</text><circle cx="856" cy="330" r="34" fill="#f8eff8" stroke="#e4c8e3" stroke-width="2"/><polyline points="856,330 886.0,330.0" fill="none" stroke="#263c4a" stroke-width="6" stroke-linejoin="round"/><circle cx="856" cy="330" r="6" fill="#263c4a"/><text x="856" y="382" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">180°</text><line x1="150" y1="420" x2="710" y2="420" stroke="#6b7785" stroke-width="2"/><polygon points="710,420 698.9,424.7 698.9,415.3" fill="#6b7785"/><line x1="710" y1="420" x2="150" y2="420" stroke="#6b7785" stroke-width="2"/><polygon points="150,420 161.1,415.3 161.1,424.7" fill="#6b7785"/><text x="430" y="412" font-size="14" fill="#6b7785" text-anchor="middle" font-weight="bold">20 ms</text><text x="30" y="452" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">La librería Servo genera estos pulsos sola: tú solo le das el ángulo con write.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Esquema de MQTT: a la izquierda, dos sensores publican mensajes en los temas invernadero/nave1/temperatura e invernadero/nave2/humedad; en el centro, el bróker recibe y reparte; a la derecha, un panel del móvil suscrito a invernadero/# recibe todo y publica la orden ON en invernadero/nave1/ventilador, y un ventilador suscrito a ese tema recibe la orden.</title><rect width="900" height="420" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">MQTT: publicar en un tema y suscribirse a él</text><rect x="355" y="140" width="190" height="110" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="450.0" y="180.54999999999998" font-size="17" fill="#263c4a" text-anchor="middle" font-weight="bold">Bróker</text><text x="450.0" y="200.95" font-size="17" fill="#263c4a" text-anchor="middle" font-weight="normal">recibe y reparte</text><text x="450.0" y="221.34999999999997" font-size="17" fill="#263c4a" text-anchor="middle" font-weight="normal">los mensajes</text><rect x="20" y="60" width="270" height="100" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="155.0" y="98.10000000000001" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor de la nave 1</text><text x="155.0" y="114.9" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">publica 24.5 en</text><text x="155.0" y="131.70000000000002" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">invernadero/nave1/temperatura</text><line x1="292" y1="110" x2="353" y2="180.0" stroke="#c43232" stroke-width="3"/><polygon points="353,180.0 342.2,174.7 349.3,168.6" fill="#c43232"/><rect x="20" y="240" width="270" height="100" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="155.0" y="278.09999999999997" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor de la nave 2</text><text x="155.0" y="294.9" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">publica 61 en</text><text x="155.0" y="311.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">invernadero/nave2/humedad</text><line x1="292" y1="290" x2="353" y2="210.0" stroke="#c43232" stroke-width="3"/><polygon points="353,210.0 350.0,221.6 342.6,216.0" fill="#c43232"/><rect x="610" y="50" width="270" height="120" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="745.0" y="89.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Panel del móvil</text><text x="745.0" y="106.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">suscrito a invernadero/#;</text><text x="745.0" y="123.30000000000001" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">publica ON en</text><text x="745.0" y="140.1" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">invernadero/nave1/ventilador</text><line x1="547" y1="172" x2="608" y2="95" stroke="#2f5fa8" stroke-width="3"/><polygon points="608,95 604.8,106.6 597.5,100.8" fill="#2f5fa8"/><line x1="608" y1="150" x2="547" y2="196" stroke="#c43232" stroke-width="3"/><polygon points="547,196 553.0,185.6 558.6,193.1" fill="#c43232"/><rect x="610" y="240" width="270" height="100" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="745.0" y="278.09999999999997" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Ventilador de la nave 1</text><text x="745.0" y="294.9" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">suscrito a</text><text x="745.0" y="311.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">invernadero/nave1/ventilador</text><line x1="547" y1="220" x2="608" y2="290" stroke="#2f5fa8" stroke-width="3"/><polygon points="608,290 597.2,284.7 604.3,278.6" fill="#2f5fa8"/><text x="30" y="368" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">En rojo, lo que se publica; en azul, lo que el bróker entrega a los suscritos. El panel publica la orden ON y el bróker</text><text x="30" y="386" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">se la entrega al ventilador. Quien publica no sabe quién está escuchando.</text><text x="30" y="408" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">En un tema, «+» sustituye a un nivel y «#» a todo lo que venga detrás.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Escala de tensiones de 0 a 5 voltios y, debajo, la lectura de analogRead que le corresponde: 0 voltios da 0, 1 voltio da 205, 2,5 voltios dan 512, 4 voltios dan 818 y 5 voltios dan 1023.</title><rect width="900" height="310" fill="white"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f3e6f3"/><stop offset="1" stop-color="#943d92"/></linearGradient></defs><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">analogRead convierte la tensión del pin en un número de 0 a 1023</text><rect x="120" y="96" width="730" height="28" rx="6" fill="url(#g)" stroke="#263c4a" stroke-width="2"/><rect x="120" y="196" width="730" height="28" rx="6" fill="white" stroke="#263c4a" stroke-width="2"/><text x="108" y="116" font-size="15" fill="#263c4a" text-anchor="end" font-weight="bold">Tensión</text><text x="108" y="216" font-size="15" fill="#263c4a" text-anchor="end" font-weight="bold">Lectura</text><line x1="120.0" y1="126" x2="120.0" y2="194" stroke="#6b7785" stroke-width="2"/><polygon points="120.0,194 115.3,182.9 124.7,182.9" fill="#6b7785"/><text x="120.0" y="88" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">0 V</text><text x="120.0" y="250" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">0</text><line x1="266.0" y1="126" x2="266.0" y2="194" stroke="#6b7785" stroke-width="2"/><polygon points="266.0,194 261.3,182.9 270.7,182.9" fill="#6b7785"/><text x="266.0" y="88" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">1 V</text><text x="266.0" y="250" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">205</text><line x1="485.0" y1="126" x2="485.0" y2="194" stroke="#6b7785" stroke-width="2"/><polygon points="485.0,194 480.3,182.9 489.7,182.9" fill="#6b7785"/><text x="485.0" y="88" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">2,5 V</text><text x="485.0" y="250" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">512</text><line x1="704.0" y1="126" x2="704.0" y2="194" stroke="#6b7785" stroke-width="2"/><polygon points="704.0,194 699.3,182.9 708.7,182.9" fill="#6b7785"/><text x="704.0" y="88" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">4 V</text><text x="704.0" y="250" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">818</text><line x1="850.0" y1="126" x2="850.0" y2="194" stroke="#6b7785" stroke-width="2"/><polygon points="850.0,194 845.3,182.9 854.7,182.9" fill="#6b7785"/><text x="850.0" y="88" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">5 V</text><text x="850.0" y="250" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">1023</text><text x="30" y="290" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Hay 1023 escalones de 5 V / 1023 ≈ 4,9 mV: el Arduino no distingue dos tensiones más próximas.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Cuatro niveles apilados de un sistema SCADA: arriba, la sala de control con el servidor SCADA y las pantallas HMI; debajo, las comunicaciones; después, el control local con PLC o RTU en cada instalación; y abajo, el campo con sensores y actuadores. Las medidas suben y las consignas bajan.</title><rect width="900" height="450" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">Un sistema SCADA, del campo a la sala de control</text><rect x="20" y="55" width="860" height="64" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="40" y="82" font-size="16" fill="#943d92" text-anchor="start" font-weight="bold">Sala de control</text><text x="40" y="105" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">servidor SCADA y HMI: pantallas, histórico, alarmas; el operador supervisa y da consignas</text><rect x="50" y="133" width="800" height="64" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="70" y="160" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Comunicaciones</text><text x="70" y="183" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">red industrial, fibra, radio o red móvil entre la sala y cada instalación</text><rect x="80" y="211" width="740" height="64" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="100" y="238" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Control local</text><text x="100" y="261" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">PLC o RTU en cada instalación: leen los sensores y gobiernan los actuadores al momento</text><rect x="110" y="289" width="680" height="64" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="130" y="316" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Campo</text><text x="130" y="339" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">sensores (nivel, caudal, presión, cloro…) y actuadores (bombas, válvulas, compuertas)</text><line x1="870" y1="350" x2="870" y2="70" stroke="#c43232" stroke-width="3"/><polygon points="870,70 874.7,81.1 865.3,81.1" fill="#c43232"/><text x="862" y="378" font-size="13" fill="#c43232" text-anchor="end" font-weight="bold">medidas</text><line x1="30" y1="70" x2="30" y2="350" stroke="#2f5fa8" stroke-width="3"/><polygon points="30,350 25.3,338.9 34.7,338.9" fill="#2f5fa8"/><text x="38" y="378" font-size="13" fill="#2f5fa8" text-anchor="start" font-weight="bold">consignas</text><text x="30" y="410" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">El control rápido (abrir una válvula, parar una bomba) lo hace el PLC en la propia instalación;</text><text x="30" y="432" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">la sala de control supervisa todo a la vez, guarda el histórico, avisa de las alarmas y cambia las consignas.</text></svg>
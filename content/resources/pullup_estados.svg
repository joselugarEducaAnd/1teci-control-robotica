.5"/><polyline points="560,175 560,195" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="576" y="155" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">10 kΩ</text><polyline points="560,195 560,235" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="560" cy="215" r="5" fill="#263c4a"/><polyline points="560,215 710,215" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="710" y="208" width="14" height="14" fill="#943d92"/><text x="731" y="221" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold">D2</text><polyline points="560,235 560,262" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="560" cy="262" r="4" fill="#263c4a"/><polyline points="560,298 560,325" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="560" cy="298" r="4" fill="#263c4a"/><polyline points="544,258 544,302" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="544,280 526,280" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="526,272 526,288" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="574" y="285" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">SW1</text><polyline points="560,325 560,335" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="544,335 576,335" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="550,341 570,341" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="556,347 564,347" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><polyline points="560,262 560,298" fill="none" stroke="#16725e" stroke-width="4" stroke-linejoin="round"/><line x1="498" y1="130" x2="498" y2="300" stroke="#16725e" stroke-width="3"/><polygon points="498,300 493.3,288.9 502.7,288.9" fill="#16725e"/><text x="490" y="215" font-size="13" fill="#16725e" text-anchor="end" font-weight="bold">0,5 mA</text><text x="490" y="365" font-size="14" fill="#263c4a" text-anchor="start" font-weight="normal">El pin queda unido a GND: lee LOW.</text><rect x="685" y="240" width="110" height="38" rx="8" fill="white" stroke="#2f5fa8" stroke-width="2.5"/><text x="740" y="265" font-size="18" fill="#2f5fa8" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">LOW</text><text x="30" y="405" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Pulsado, la corriente que pasa por la resistencia es I = 5 V / 10 000 Ω = 0,5 mA: casi nada.</text></svg>
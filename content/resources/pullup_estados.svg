<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Dos esquemas del pulsador SW1 con su resistencia pull-up: suelto, la resistencia de 10 kilohmios lleva el pin D2 a 5 V y se lee HIGH; pulsado, el pin queda unido a GND y se lee LOW, y por la resistencia pasan 0,5 mA.</title><rect width="900" height="420" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">El pulsador del shield: resistencia pull-up de 10 kΩ</text><rect x="40" y="50" width="400" height="330" rx="12" fill="white" stroke="#e4c8e3" stroke-width="2"/><text x="60" y="80" font-size="18" fill="#943d92" text-anchor="start" font-weight="bold">Suelto</text><polyline points="114,105 146,105" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="130" y="97" font-size="15" fill="#c43232" text-anchor="middle" font-weight="bold">5 V</text><polyline points="130,105 130,125" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="121" y="125" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="130,175 130,195" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="146" y="155" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">10 kΩ</text><polyline points="130,195 130,235" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="130" cy="215" r="5" fill="#263c4a"/><polyline points="130,215 280,215" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="280" y="208" width="14" height="14" fill="#943d92"/><text x="301" y="221" font-size="15" fill="#943d92" text-anchor="start" font-weight="bold">D2</text><polyline points="130,235 130,262" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="130" cy="262" r="4" fill="#263c4a"/><polyline points="130,298 130,325" fill=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Diagrama de cinco bloques en fila: tu programa con Serial.print y Serial.read, el microcontrolador ATmega328P con los pines 1, TX, y 0, RX, el chip USB que traduce entre serie y USB, el ordenador con el puerto /dev/ttyACM0 o /dev/ttyUSB0 y el monitor serie o el panel web a 9600 baudios. Flechas rojas hacia la derecha para lo que envía la placa y azules hacia la izquierda para lo que recibe.</title><rect width="900" height="295" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">El camino de los datos entre tu programa y el ordenador</text><rect x="20" y="70" width="150" height="110" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="95.0" y="112.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Tu programa</text><text x="95.0" y="130.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">Serial.print(...)</text><text x="95.0" y="148.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">Serial.read()</text><line x1="172" y1="108" x2="195" y2="108" stroke="#c43232" stroke-width="3"/><polygon points="195,108 183.9,112.7 183.9,103.3" fill="#c43232"/><line x1="195" y1="145" x2="172" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="172,145 183.1,140.3 183.1,149.7" fill="#2f5fa8"/><rect x="197" y="70" width="150" height="110" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="272.0" y="112.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">ATmega328P</text><text x="272.0" y="130.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">pines 1 (TX)</text><text x="272.0" y="148.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">y 0 (RX)</text><line x1="349" y1="108" x2="372" y2="108" stroke="#c43232" stroke-width="3"/><polygon points="372,108 360.9,112.7 360.9,103.3" fill="#c43232"/><line x1="372" y1="145" x2="349" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="349,145 360.1,140.3 360.1,149.7" fill="#2f5fa8"/><rect x="374" y="70" width="150" height="110" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="449.0" y="121.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Chip USB</text><text x="449.0" y="139.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">serie ⇄ USB</text><line x1="526" y1="108" x2="549" y2="108" stroke="#c43232" stroke-width="3"/><polygon points="549,108 537.9,112.7 537.9,103.3" fill="#c43232"/><line x1="549" y1="145" x2="526" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="526,145 537.1,140.3 537.1,149.7" fill="#2f5fa8"/><rect x="551" y="70" width="150" height="110" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="626.0" y="112.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Ordenador</text><text x="626.0" y="130.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">/dev/ttyACM0</text><text x="626.0" y="148.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">o /dev/ttyUSB0</text><line x1="703" y1="108" x2="726" y2="108" stroke="#c43232" stroke-width="3"/><polygon points="726,108 714.9,112.7 714.9,103.3" fill="#c43232"/><line x1="726" y1="145" x2="703" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="703,145 714.1,140.3 714.1,149.7" fill="#2f5fa8"/><rect x="728" y="70" width="150" height="110" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="803.0" y="112.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Monitor serie</text><text x="803.0" y="130.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">o panel web</text><text x="803.0" y="148.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">(9600 baudios)</text><text x="20" y="222" font-size="15" fill="#c43232" text-anchor="start" font-weight="bold">→ en rojo, lo que la placa envía (TX): lo que escribe Serial.print.</text><text x="20" y="248" font-size="15" fill="#2f5fa8" text-anchor="start" font-weight="bold">← en azul, lo que la placa recibe (RX): lo que lee Serial.read.</text><text x="20" y="278" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Usa el puerto con un solo programa a la vez: cierra el monitor serie antes de abrir otro (por ejemplo, el panel web).</text></svg>
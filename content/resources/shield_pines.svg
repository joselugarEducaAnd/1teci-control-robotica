<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 666" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Tabla de pines del shield HY-M302: pulsadores en D2 y D3 (pulsado da LOW), DHT11 en D4, zumbador en D5, infrarrojos en D6, conectores libres en D7 y D8, LED RGB en D9 rojo, D10 azul y D11 verde, LED rojo en D12, LED azul en D13, potenciómetro en A0, LDR en A1, LM35 en A2 y conector libre en A3.</title><rect width="960" height="666" fill="white"/><text x="30" y="38" font-size="20" fill="#943d92" text-anchor="start" font-weight="bold">El shield HY-M302: cada componente en su pin, siempre el mismo</text><rect x="30" y="70" width="900" height="34" fill="#943d92"/><text x="75" y="93" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Pin</text><text x="135" y="93" font-size="16" fill="white" text-anchor="start" font-weight="bold">Componente</text><text x="480" y="93" font-size="16" fill="white" text-anchor="start" font-weight="bold">Qué da o qué hace</text><rect x="30" y="104" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="126" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D2</text><text x="135" y="126" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Pulsador SW1</text><text x="480" y="126" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">pulsado da LOW, suelto da HIGH; frente al LED azul</text><rect x="30" y="136" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="158" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D3</text><text x="135" y="158" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Pulsador SW2</text><text x="480" y="158" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">pulsado da LOW, suelto da HIGH; frente al LED rojo</text><rect x="30" y="168" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="190" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D4</text><text x="135" y="190" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Sensor DHT11</text><text x="480" y="190" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">temperatura y humedad (necesita librería)</text><rect x="30" y="200" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="222" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D5</text><text x="135" y="222" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Zumbador</text><text x="480" y="222" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">suena con tone(); va a través de un transistor</text><rect x="30" y="232" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="254" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D6</text><text x="135" y="254" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Receptor de infrarrojos</text><text x="480" y="254" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">mando a distancia</text><rect x="30" y="264" width="900" height="32" fill="#fff6e5" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="286" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D7</text><text x="135" y="286" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold">Conector libre de 3 patillas</text><text x="480" y="286" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">GND, VCC y señal: servo u otro módulo</text><rect x="30" y="296" width="900" height="32" fill="#fff6e5" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="318" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D8</text><text x="135" y="318" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold">Conector libre de 3 patillas</text><text x="480" y="318" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">GND, VCC y señal: servo u otro módulo</text><rect x="30" y="328" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="350" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D9</text><text x="135" y="350" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: rojo</text><text x="480" y="350" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">PWM (~)</text><rect x="30" y="360" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="382" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D10</text><text x="135" y="382" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: azul</text><text x="480" y="382" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">PWM (~)</text><rect x="30" y="392" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="414" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D11</text><text x="135" y="414" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: verde</text><text x="480" y="414" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">PWM (~)</text><rect x="30" y="424" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="446" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D12</text><text x="135" y="446" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED rojo</text><text x="480" y="446" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">solo encendido o apagado</text><rect x="30" y="456" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="478" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D13</text><text x="135" y="478" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LED azul</text><text x="480" y="478" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">solo encendido o apagado; es también el LED «L» de la placa</text><rect x="30" y="488" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="510" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A0</text><text x="135" y="510" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Potenciómetro</text><text x="480" y="510" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">de 0 a 1023; sube al girarlo en sentido horario</text><rect x="30" y="520" width="900" height="32" fill="#f8eff8" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="542" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A1</text><text x="135" y="542" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LDR (luz)</text><text x="480" y="542" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">más luz, lectura mayor</text><rect x="30" y="552" width="900" height="32" fill="white" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="574" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A2</text><text x="135" y="574" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Sensor LM35</text><text x="480" y="574" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">10 mV por cada °C</text><rect x="30" y="584" width="900" height="32" fill="#fff6e5" stroke="#e4c8e3" stroke-width="1"/><text x="75" y="606" font-size="16" fill="#943d92" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A3</text><text x="135" y="606" font-size="15" fill="#263c4a" text-anchor="start" font-weight="bold">Conector libre de 3 patillas</text><text x="480" y="606" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">GND, VCC y señal: aquí va el servo</text><text x="30" y="646" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">En naranja, los conectores libres de tres patillas (GND, VCC y señal): allí se enchufa lo que no trae el shield.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Cuatro bloques en fila: dispositivos (sensores y actuadores), red y pasarela, plataforma en la nube o en un servidor, y aplicación con paneles, móvil y alarmas, con el ejemplo de un riego. Flechas rojas hacia la derecha para las medidas y azules hacia la izquierda para las órdenes.</title><rect width="900" height="310" fill="white"/><text x="30" y="32" font-size="19" fill="#943d92" text-anchor="start" font-weight="bold">El internet de las cosas en cuatro capas</text><rect x="20" y="55" width="196" height="130" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="118.0" y="99.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Dispositivos</text><text x="118.0" y="116.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">sensores que miden</text><text x="118.0" y="133.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">y actuadores</text><text x="118.0" y="150.1" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">que obedecen</text><text x="118" y="208" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">Ejemplo: una estación de</text><text x="118" y="226" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">riego en el campo</text><line x1="218" y1="100" x2="240" y2="100" stroke="#c43232" stroke-width="3"/><polygon points="240,100 228.9,104.7 228.9,95.3" fill="#c43232"/><line x1="240" y1="145" x2="218" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="218,145 229.1,140.3 229.1,149.7" fill="#2f5fa8"/><rect x="242" y="55" width="196" height="130" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="340.0" y="99.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Red y pasarela</text><text x="340.0" y="116.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">llevan los datos</text><text x="340.0" y="133.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">(wifi, LoRa,</text><text x="340.0" y="150.1" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">red móvil…)</text><text x="340" y="208" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">Ejemplo: LoRa hasta</text><text x="340" y="226" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">una antena</text><line x1="440" y1="100" x2="462" y2="100" stroke="#c43232" stroke-width="3"/><polygon points="462,100 450.9,104.7 450.9,95.3" fill="#c43232"/><line x1="462" y1="145" x2="440" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="440,145 451.1,140.3 451.1,149.7" fill="#2f5fa8"/><rect x="464" y="55" width="196" height="130" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="562.0" y="99.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Plataforma</text><text x="562.0" y="116.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">en la nube o en</text><text x="562.0" y="133.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">un servidor: guarda,</text><text x="562.0" y="150.1" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">procesa y avisa</text><text x="562" y="208" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">Ejemplo: guarda la humedad</text><text x="562" y="226" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">de cada hora</text><line x1="662" y1="100" x2="684" y2="100" stroke="#c43232" stroke-width="3"/><polygon points="684,100 672.9,104.7 672.9,95.3" fill="#c43232"/><line x1="684" y1="145" x2="662" y2="145" stroke="#2f5fa8" stroke-width="3"/><polygon points="662,145 673.1,140.3 673.1,149.7" fill="#2f5fa8"/><rect x="686" y="55" width="196" height="130" rx="10" fill="#f8eff8" stroke="#943d92" stroke-width="2.5"/><text x="784.0" y="99.7" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Aplicación</text><text x="784.0" y="116.5" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">paneles, móvil,</text><text x="784.0" y="133.3" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">alarmas</text><text x="784.0" y="150.1" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">y decisiones</text><text x="784" y="208" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">Ejemplo: el agricultor</text><text x="784" y="226" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">lo ve en el móvil</text><text x="20" y="265" font-size="15" fill="#c43232" text-anchor="start" font-weight="bold">→ en rojo, las medidas suben desde los sensores hasta la aplicación (telemetría).</text><text x="20" y="290" font-size="15" fill="#2f5fa8" text-anchor="start" font-weight="bold">← en azul, las órdenes bajan desde la aplicación hasta los actuadores (control a distancia).</text></svg>